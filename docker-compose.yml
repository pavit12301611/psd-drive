services:
  psdrive:
    build: .
    container_name: psdrive
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # APP_URL is only used for links that leave the app (Google OAuth redirects).
      APP_URL: ${APP_URL:-http://localhost:3000}
      DEMO_MODE: ${DEMO_MODE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional: bake Google OAuth credentials in instead of using Settings.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Forces a stable encryption key across container rebuilds.
      APP_SECRET: ${APP_SECRET:-}
    volumes:
      - psdrive-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  psdrive-data:
